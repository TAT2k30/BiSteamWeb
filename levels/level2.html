<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 2 - BiSteam</title>
    <link rel="stylesheet" href="../assets/css/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../assets/images/logo/image-removebg-preview.png">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <!-- Matrix Background -->
    <canvas id="matrixCanvas"></canvas>

    <header>
      <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="../index.html">
            <img src="../assets/images/logo/image-removebg-preview.png" alt="Logo" />
          </a>
          <form class="d-flex" id="searchForm">
            <input
              class="form-control me-2"
              type="search"
              id="searchInput"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </nav>
    </header>
    <div class="boss">
      <div class="container">
        <div style="background-color: #fff023; border-radius: 20px">
          <h1 style="padding: 4px 50px">Level 2 Robots</h1>
        </div>
        <div class="content">
          <!-- Add Level 2 robot items here -->

        </div>
      </div>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="pdfModal"
      tabindex="-1"
      aria-labelledby="pdfModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="pdfModalLabel">PDF Viewer</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <iframe id="pdfViewer" src="" width="100%" height="600px"></iframe>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/matrix.js"></script>

    <script>
      $(document).ready(function () {
        $("#searchForm").submit(function (event) {
          event.preventDefault();
          const searchInput = $("#searchInput").val().toLowerCase();
          $(".item").each(function () {
            const itemName = $(this).data("name").toLowerCase();
            if (itemName.includes(searchInput)) {
              $(this).show();
            } else {
              $(this).hide();
            }
          });
        });

        // Open PDF in a new tab
        $(".item").click(function () {
          const pdfUrl = $(this).data("pdf");
          if (pdfUrl) {
            window.open(pdfUrl, "_blank");
          }
        });
      });
    </script>
  </body>
</html>
